<!html lib>
<!--
  Blog component that renders posts from the content collection.
  Draft posts are filtered out (also excluded by the collection config).
-->
<ul :is="blog-posts" class="gallery">
  <li :for="post in posts.filter(p => !p.draft)">
    <a :href="post.url">
      <figure>
        <pretty-date :date="post.publishedDate || post.date" />
        <h2>{ post.title }</h2>
        <p>{ post.description }</p>
      </figure>
    </a>
  </li>
</ul>

<style>
  @include "gallery.css"
</style>
